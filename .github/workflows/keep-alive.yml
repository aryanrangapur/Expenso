name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          set -e

          echo "Pinging API root..."
          curl -f -s https://expenso-4czh.onrender.com/api/ > /dev/null
          echo "✅ API root OK"

          echo "Pinging expenses endpoint..."
          curl -f -s https://expenso-4czh.onrender.com/api/expenses/ > /dev/null
          echo "✅ Expenses endpoint OK"

          echo "Backend kept alive at $(date -u)"
